server:
  port: 8090

spring:
  application:
    name: userManager

  datasource:
    url: jdbc:postgresql://localhost:5432/userDB
    username: admin
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties.hibernate.format_sql: true